services:
  pixelvault:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - pixelvault_data:/app/data
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATA_DIR=/app/data
      - BROWSER_MAX_CONTEXTS=2
      - BROWSER_IDLE_MS=300000
      - CRON_SECRET=${CRON_SECRET:-}
    restart: unless-stopped
    # Nightly backup via host cron: 0 3 * * * curl -H "x-cron-secret: $CRON_SECRET" http://localhost:3000/api/cron/backup

volumes:
  pixelvault_data:
